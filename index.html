<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Check</title>

    <!-- The stamp busts the browser cache, so a stale app.js is never what runs. -->
    <script src="assets/app.js?v=3" defer></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background: #080b10;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            text-align: center;
        }

        h1 {
            font-size: 48px;
        }

        p {
            color: #777;
        }
    </style>
</head>

<body>

    <!--
        System status: unknown.

        The browser may already know the answer.

        are_you_ok=false

        Maybe changing the answer will change the result.
    -->

    <div class="box">
        <h1>System Check</h1>

        <p>
            Security verification in progress...
        </p>
    </div>

</body>
</html>
